name: Weekly Donation Refresh

on:
  schedule:
    - cron: '0 5 * * 0'  # Sunday 05:00 UTC = ~midnight Eastern
  workflow_dispatch:      # allow manual trigger from GitHub UI

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # FEC bulk match takes ~90 min for full 2018-2024 history, more with 2026 added

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r build/requirements.txt

      # Download cache from Supabase Storage (persists across runs indefinitely)
      - name: Download donation cache
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python build/cache_storage.py download

      - name: Refresh FEC donation data
        env:
          SUPABASE_DSN: ${{ secrets.SUPABASE_DSN }}
        run: python build/fetch_fec_bulk.py --all-parties --cycles 2018 2020 2022 2024 2026

      # download_nyboe() resumes from its partial .csv.tmp on retry, so
      # retrying in-step (same runner/filesystem) actually picks up where
      # a stalled attempt left off instead of re-fetching millions of rows.
      - name: Refresh NYBOE donation data
        env:
          SUPABASE_DSN: ${{ secrets.SUPABASE_DSN }}
        run: |
          for attempt in 1 2 3; do
            python build/fetch_nyboe.py --all-parties && break
            echo "Attempt $attempt failed."
            if [ "$attempt" = "3" ]; then exit 1; fi
            echo "Retrying in 30s..."
            sleep 30
          done

      - name: Sync donations to Supabase
        env:
          SUPABASE_DSN: ${{ secrets.SUPABASE_DSN }}
        run: python build/migrate_donations_psycopg2.py

      # Upload updated cache back to Supabase Storage
      - name: Upload donation cache
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python build/cache_storage.py upload
